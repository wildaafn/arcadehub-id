name: Daily Refresh

on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger refresh-all
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
        run: |
          # Pastikan secrets sudah diisi
          if [ -z "$APP_BASE_URL" ]; then
            echo "❌ Error: secret APP_BASE_URL belum diset di repository secrets."
            exit 1
          fi
          if [ -z "$CRON_SECRET" ]; then
            echo "❌ Error: secret CRON_SECRET belum diset di repository secrets."
            exit 1
          fi

          echo "🔄 Memanggil $APP_BASE_URL/api/refresh-all ..."

          HTTP_CODE=$(curl -s -o /tmp/refresh_body.json -w "%{http_code}" \
            --max-time 120 \
            -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_BASE_URL/api/refresh-all") || {
            echo "❌ curl gagal terhubung ke endpoint."
            exit 1
          }

          echo "📡 HTTP Response Code: $HTTP_CODE"
          echo "📄 Response Body:"
          cat /tmp/refresh_body.json || true

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "✅ Refresh berhasil: HTTP $HTTP_CODE"
          else
            echo "❌ Refresh gagal: HTTP $HTTP_CODE"
            exit 1
          fi
