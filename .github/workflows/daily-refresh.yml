name: Daily Refresh

on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger refresh-all
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_BASE_URL }}/api/refresh-all")
          if [ "$response" -lt 200 ] || [ "$response" -ge 300 ]; then
            echo "Refresh gagal: HTTP $response"
            exit 1
          fi
          echo "Refresh berhasil: HTTP $response"
